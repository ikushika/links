  body::after{
    content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg,
      rgba(16,11,8,.88) 0%, rgba(16,11,8,.70) 34%,
      rgba(16,11,8,.72) 66%, rgba(16,11,8,.90) 100%);
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:440px}

  /* ---- ヘッダー ---- */
  header{text-align:center;padding:6px 0 26px}
  .logo{display:block;width:174px;height:auto;margin:0 auto 16px;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
  .motto{font-family:"Shippori Mincho",serif;font-size:.92rem;
    color:rgba(246,239,228,.82);letter-spacing:.18em;line-height:1.95}

  /* ---- 店舗ブロック ---- */
  .shop{margin-bottom:24px}
  .shop-head{display:flex;align-items:baseline;gap:10px;padding:0 4px 12px}
  .shop-head::before{content:"";width:4px;height:1.1em;background:var(--accent);
    border-radius:2px;transform:translateY(.16em);flex:none}
  .shop-name{font-family:"Shippori Mincho",serif;font-weight:600;
    font-size:1.24rem;letter-spacing:.05em}
  .shop-tag{font-size:.68rem;color:rgba(246,239,228,.72);
    border:1px solid rgba(255,255,255,.26);border-radius:999px;
    padding:2px 9px;letter-spacing:.06em;align-self:center}

  /* ---- ボタン ---- */
  .btns{display:flex;flex-direction:column;gap:10px}
  .btn{display:flex;align-items:center;gap:13px;text-decoration:none;
    color:var(--text);background:var(--card);
    -webkit-backdrop-filter:blur(7px) saturate(115%);
    backdrop-filter:blur(7px) saturate(115%);
    border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;min-height:58px;box-shadow:var(--shadow);
    transition:transform .12s ease, background .12s ease, border-color .12s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
  .btn .ic{flex:none;width:22px;height:22px;color:var(--accent)}
  .btn .txt{flex:1;min-width:0}
  .btn .label{font-weight:500;font-size:1rem;line-height:1.3}
  .btn .sub{font-size:.72rem;color:var(--text-soft);margin-top:1px}
  .btn .arrow{flex:none;color:rgba(246,239,228,.5);width:16px;height:16px}

  /* 主役（予約・デリバリー）は朱塗り */
  .btn.primary{background:var(--accent);border-color:var(--accent);
    -webkit-backdrop-filter:none;backdrop-filter:none;color:#fff;
    box-shadow:0 6px 22px rgba(209,74,50,.32)}
  .btn.primary .ic,.btn.primary .arrow{color:#fff}
  .btn.primary .sub{color:rgba(255,255,255,.82)}
  .btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}

  /* URL未設定 */
  .btn.todo{opacity:.45;pointer-events:none;background:transparent;
    box-shadow:none;border-style:dashed;-webkit-backdrop-filter:none;backdrop-filter:none}
  .btn.todo .sub{color:var(--accent)}

  footer{text-align:center;margin-top:30px;font-size:.7rem;
    color:rgba(246,239,228,.45);letter-spacing:.08em}

  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

<script>
/* =========================================================
   ▼▼▼ ここだけ編集してください ▼▼▼
   url:"" を差し替えるだけ。空だと「未設定」のグレー表示になります。
   primary:true で朱色の目立つボタンに。
   ========================================================= */
const TOP_LINKS = [
  { label:"公式ホームページ", sub:"ブランドについて", icon:"home", url:"https://ikushika.com" },
];

const CONFIG = [
  {
    name:"渋谷店",
    tag:"ご予約不可",
    links:[
      { label:"Googleマップ",   sub:"お店の場所・道順",   icon:"map",       url:"https://maps.app.goo.gl/kRYZiVN4MFwKDP3dA?g_st=ic" },
      { label:"公式Instagram",  sub:"最新の情報はこちら", icon:"instagram", url:"https://www.instagram.com/580ikushika_com?igsh=MXFoeTI5NnN6aTkyMg%3D%3D&utm_source=qr" },
    ]
  },
  {
    name:"中目黒店",
    tag:"ご予約可",
    links:[
      { label:"Googleマップ",       sub:"お店の場所・道順",       icon:"map",       url:"https://maps.app.goo.gl/rLkm8ZsbLpxaJSu26?g_st=ic" },
      { label:"公式Instagram",      sub:"最新の情報はこちら",     icon:"instagram", url:"https://www.instagram.com/581ikushika_com?igsh=MW43MXlwdWJva3g2NA%3D%3D&utm_source=qr" },
      { label:"ご予約はこちら",     sub:"席を確保する",           icon:"calendar",  url:"https://www.tablecheck.com/ja/ikushika/reserve/message", primary:true },
      { label:"デリバリー注文",     sub:"Uber Eats / Rocket Now", icon:"bag",       url:"https://ikushika.github.io/Delivery/", primary:true },
    ]
  },
];
/* ▲▲▲ 編集ここまで ▲▲▲ */

const ICONS = {
  map:'<path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.6" cy="7.4" r="1.1" fill="currentColor"/>',
  calendar:'<rect x="4" y="5.5" width="16" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M8 3.5v4M16 3.5v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  bag:'<path d="M6 8h12l-1 12H7L6 8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  home:'<path d="M4 11l8-6 8 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
};
const ARROW = '<path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
function svg(p){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';}

function renderBtn(l){
  const empty = !l.url;
  const cls = ["btn", l.primary && !empty ? "primary" : "", empty ? "todo" : ""].filter(Boolean).join(" ");
  const href = empty ? "" : `href="${l.url}"`;
  const target = empty ? "" : `target="_blank" rel="noopener"`;
  const sub = empty ? "URL未設定" : (l.sub || "");
  return `<a class="${cls}" ${href} ${target}>
    <span class="ic">${svg(ICONS[l.icon] || ICONS.map)}</span>
    <span class="txt">
      <span class="label">${l.label}</span>
      ${sub ? `<span class="sub">${sub}</span>` : ""}
    </span>
    <span class="arrow">${svg(ARROW)}</span>
  </a>`;
}

const app = document.getElementById("app");
const topHtml = TOP_LINKS.length
  ? `<section class="shop"><div class="btns">${TOP_LINKS.map(renderBtn).join("")}</div></section>`
  : "";
app.innerHTML = topHtml + CONFIG.map(shop => `
  <section class="shop">
    <div class="shop-head">
      <span class="shop-name">${shop.name}</span>
      ${shop.tag ? `<span class="shop-tag">${shop.tag}</span>` : ""}
    </div>
    <div class="btns">${shop.links.map(renderBtn).join("")}</div>
  </section>
`).join("");
</script>
</body>
</html>
