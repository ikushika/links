name: cm-fetch

# Temporary relay for the いくしか CM edit: downloads generated clips listed in
# fetch/urls.txt and commits them to this branch. Delete with the cm-work branch.
on:
  push:
    branches: [cm-work]
    paths: ['fetch/urls.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          mkdir -p fetched
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            echo "::add-mask::$url"
            curl -sSL --retry 3 --fail -o "fetched/$name" "$url"
            echo "$name $(stat -c %s "fetched/$name") bytes"
          done < fetch/urls.txt
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fetched
          git commit -m "Fetched CM assets [skip ci]" || echo "nothing to commit"
          git push
